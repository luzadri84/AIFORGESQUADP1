spring.application.name=booking
spring.config.import=configtree:/run/secrets/,optional:file:/workspace/.local/runtime/booking.properties
spring.datasource.url=${JDBC_URL}
spring.datasource.username=${JDBC_USER}
spring.datasource.password=${app_password}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.sql.init.mode=never
spring.jackson.deserialization.fail-on-unknown-properties=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.error.include-message=never
server.error.include-stacktrace=never

# Request integer fields accept JSON integer tokens only; no truncation or numeric strings.
spring.jackson.deserialization.accept-float-as-int=false
spring.jackson.mapper.allow-coercion-of-scalars=false
